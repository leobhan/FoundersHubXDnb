name: baby-cry-mvp
board: 14port
modules:
- id: neopixel
  instance: greenLight
  port: port_1
- id: button
  instance: correctButton
  port: port_2
- id: st7735_tft
  instance: screen
  ports:
  - port_3
  - port_4
- id: button
  instance: wrongButton
  port: port_5
- id: neopixel
  instance: redLight
  port: port_6
- id: microphone
  instance: mic
  ports:
  - port_13
  - port_14
feedback: false
code:
  globals: "// Hearing a cry and guessing the need happen in cry/ (cry_dsp.h, cry_engine.h);\n\
    // tools/baseline/README.md explains where the baseline comes from.\n#include\
    \ <LittleFS.h>   // here too, so PlatformIO finds the library\n#include \"../../cry/cry_engine.h\"\
    \n\nstatic const char* const NEED_NAME[CRY_N_NEEDS] = {\"Hungry\", \"Sleepy\"\
    , \"Diaper\", \"Discomfort\"};\nstatic const char* const NEED_SHORT[CRY_N_NEEDS]\
    \ = {\"Hun\", \"Sle\", \"Dia\", \"Dis\"};\nstatic const char* const NEED_HINT[CRY_N_NEEDS]\
    \ = {\"Try a feed\", \"Try settling to sleep\", \"Check the diaper\",\n      \
    \                                             \"Burp, check temperature\"};\n\
    // The design's colours #F5A84A, #8DB8F2, #B9A3F2, #F08FA8 in RGB565.\nstatic\
    \ const uint16_t NEED_COLOR[CRY_N_NEEDS] = {0xF549, 0x8DDE, 0xBD1E, 0xF475};\n\
    static const uint16_t UI_GREY = 0x9CD3;\n\nenum UiState { UI_LISTENING, UI_CRY_HEARD,\
    \ UI_GUESS, UI_GOT_IT, UI_NOT_SAVED, UI_FORGOT };\nstatic const unsigned long\
    \ CRY_HEARD_MS = 1500;\nstatic const unsigned long MESSAGE_MS = 3000;\nstatic\
    \ const unsigned long ANSWER_TIMEOUT_MS = 10UL * 60 * 1000;\nstatic const unsigned\
    \ long FORGET_HOLD_MS = 3000;\nstatic const unsigned long LIGHT_MS = 1000;\n\n\
    static CryListener cry;\nstatic CryStore store;\nstatic UiState ui = UI_LISTENING;\n\
    static unsigned long uiSince = 0;\nstatic bool uiDirty = true;\nstatic float guessFp[CRY_N_FEATURES];\n\
    static float guessProb[CRY_N_NEEDS];\nstatic uint8_t rejected = 0;           \
    \ // a bit per need the parent said no to\nstatic int shown = 0;             \
    \      // the need on screen\nstatic bool savedToFlash = false;\nstatic unsigned\
    \ long lastHungryMs = 0;  // last confirmed Hungry, 0 = none since boot\nstatic\
    \ bool lightOn = false;\nstatic unsigned long lightSince = 0;\n\nstatic void setUi(UiState\
    \ s) {\n  ui = s;\n  uiSince = millis();\n  uiDirty = true;\n}\n\n// The next\
    \ guess waits until the baby has been quiet, so one long cry gives one guess.\n\
    static void backToListening() {\n  cry.disarm();\n  setUi(UI_LISTENING);\n}\n\n\
    static void flashLight(NeoPixelGrid& light, uint8_t r, uint8_t g) {\n  greenLight.clear();\n\
    \  greenLight.show();\n  redLight.clear();\n  redLight.show();\n  light.setAll(r,\
    \ g, 0);\n  light.show();\n  lightOn = true;\n  lightSince = millis();\n}\n\n\
    // ---- events to the laptop ----\n\nstatic void eventStart(const char* key) {\n\
    \  Serial.print(\"{\\\"type\\\":\\\"event\\\",\\\"payload\\\":{\\\"event_type\\\
    \":\\\"sensor\\\",\\\"key\\\":\\\"\");\n  Serial.print(key);\n  Serial.print(\"\
    \\\",\\\"value\\\":\");\n}\n\nstatic void eventEnd() { Serial.println(\"}}\");\
    \ }\n\nstatic void printFloats(const float* v, int n) {\n  Serial.print('[');\n\
    \  for (int i = 0; i < n; i++) {\n    if (i) Serial.print(',');\n    Serial.print(v[i],\
    \ 5);\n  }\n  Serial.print(']');\n}\n\n// ---- the guess and the buttons ----\n\
    \n// The most likely need the parent has not said no to, or -1.\nstatic int bestRemaining()\
    \ {\n  int best = -1;\n  for (int c = 0; c < CRY_N_NEEDS; c++)\n    if (!(rejected\
    \ & (1 << c)) && (best < 0 || guessProb[c] > guessProb[best])) best = c;\n  return\
    \ best;\n}\n\n// A need's share of what is left after the parent's no's, in %.\n\
    static int percentOf(int c) {\n  float left = 0;\n  for (int k = 0; k < CRY_N_NEEDS;\
    \ k++)\n    if (!(rejected & (1 << k))) left += guessProb[k];\n  return (int)lroundf(100\
    \ * guessProb[c] / left);\n}\n\nstatic void startGuess() {\n  memcpy(guessFp,\
    \ cry.fp, sizeof(guessFp));\n  float boost = 1;   // Hungry gets likelier from\
    \ 2 h after a confirmed feed, up to 2x at 4 h\n  if (lastHungryMs) {\n    float\
    \ hours = (millis() - lastHungryMs) / 3600000.0f;\n    boost = 1 + fminf(1, fmaxf(0,\
    \ (hours - 2) / 2));\n  }\n  cryPosterior(guessFp, store.cries, store.count, boost,\
    \ guessProb);\n  rejected = 0;\n  shown = bestRemaining();\n  setUi(UI_CRY_HEARD);\n\
    \  eventStart(\"cry_guess\");\n  Serial.print('{');\n  for (int c = 0; c < CRY_N_NEEDS;\
    \ c++) Serial.printf(\"\\\"%s\\\":%.3f,\", NEED_NAME[c], guessProb[c]);\n  Serial.printf(\"\
    \\\"learned\\\":%d,\\\"hungry_boost\\\":%.2f}\", store.count, boost);\n  eventEnd();\n\
    }\n\n// Green: the shown need was right. The cry is saved for this baby.\nstatic\
    \ void confirmGuess() {\n  savedToFlash = store.add(shown, guessFp);\n  if (shown\
    \ == NEED_HUNGRY) lastHungryMs = millis() | 1;\n  eventStart(\"cry_saved\");\n\
    \  Serial.printf(\"{\\\"need\\\":\\\"%s\\\",\\\"learned\\\":%d,\\\"in_flash\\\"\
    :%s,\\\"fp\\\":\", NEED_NAME[shown], store.count,\n                savedToFlash\
    \ ? \"true\" : \"false\");\n  printFloats(guessFp, CRY_N_FEATURES);\n  Serial.print('}');\n\
    \  eventEnd();\n  flashLight(greenLight, 0, 255);\n  setUi(UI_GOT_IT);\n}\n\n\
    // Red: show the next most likely need. After all four, nothing is saved.\nstatic\
    \ void rejectGuess() {\n  rejected |= 1 << shown;\n  flashLight(redLight, 255,\
    \ 0);\n  shown = bestRemaining();\n  if (shown < 0) setUi(UI_NOT_SAVED);\n  else\
    \ uiDirty = true;\n}\n\n// ---- screen (plain placeholder until the Nattlys design\
    \ is built) ----\n\nstatic void drawText(int x, int y, uint8_t size, uint16_t\
    \ color, const char* text) {\n  screen.setTextSize(size);\n  screen.setTextColor(color);\n\
    \  screen.setCursor(x, y);\n  screen.print(text);\n}\n\n// What the listening\
    \ screen says under its title.\nstatic int listeningHint() {\n  if (cry.quietFrames\
    \ < 16) return 1;   // a cry-like frame in the last 0.5 s\n  if (!cry.isArmed())\
    \ return 2;\n  return 0;\n}\n\nstatic void drawUi() {\n  char buf[32];\n  screen.clear();\n\
    \  drawText(2, 1, 1, ST7735_TFT::COLOR_WHITE, \"Nattlys\");\n  snprintf(buf, sizeof(buf),\
    \ \"%d learned\", store.count);\n  drawText(screen.width() - 2 - 6 * (int)strlen(buf),\
    \ 1, 1, UI_GREY, buf);\n\n  switch (ui) {\n    case UI_LISTENING: {\n      drawText(2,\
    \ 20, 2, ST7735_TFT::COLOR_WHITE, \"Listening\");\n      drawText(2, 44, 1, UI_GREY,\
    \ \"A guess appears when\");\n      drawText(2, 54, 1, UI_GREY, \"the baby cries.\"\
    );\n      int hint = listeningHint();\n      if (hint == 1) drawText(2, 70, 1,\
    \ ST7735_TFT::COLOR_ORANGE, \"Hearing a cry...\");\n      if (hint == 2) drawText(2,\
    \ 70, 1, UI_GREY, \"Next guess after quiet\");\n      break;\n    }\n    case\
    \ UI_CRY_HEARD:\n      drawText(2, 20, 2, ST7735_TFT::COLOR_WHITE, \"Crying heard\"\
    );\n      snprintf(buf, sizeof(buf), \"Comparing with %d\", store.count);\n  \
    \    drawText(2, 44, 1, UI_GREY, buf);\n      drawText(2, 54, 1, UI_GREY, store.count\
    \ == 1 ? \"saved cry\" : \"saved cries\");\n      break;\n    case UI_GUESS: {\n\
    \      drawText(2, 12, 1, UI_GREY, rejected ? \"THEN MAYBE...\" : \"BEST GUESS\"\
    );\n      drawText(2, 22, 2, NEED_COLOR[shown], NEED_NAME[shown]);\n      snprintf(buf,\
    \ sizeof(buf), \"%d%% sure\", percentOf(shown));\n      drawText(2, 40, 1, NEED_COLOR[shown],\
    \ buf);\n      drawText(2, 50, 1, ST7735_TFT::COLOR_WHITE, NEED_HINT[shown]);\n\
    \      int x = 2;\n      for (int c = 0; c < CRY_N_NEEDS; c++) {\n        if (c\
    \ == shown) continue;\n        if (rejected & (1 << c)) snprintf(buf, sizeof(buf),\
    \ \"%s x \", NEED_SHORT[c]);\n        else snprintf(buf, sizeof(buf), \"%s %d%%\
    \ \", NEED_SHORT[c], percentOf(c));\n        drawText(x, 60, 1, (rejected & (1\
    \ << c)) ? UI_GREY : NEED_COLOR[c], buf);\n        x += 6 * strlen(buf);\n   \
    \   }\n      drawText(2, 71, 1, UI_GREY, \"Right? green yes, red no\");\n    \
    \  break;\n    }\n    case UI_GOT_IT:\n      drawText(2, 12, 1, UI_GREY, \"GOT\
    \ IT\");\n      drawText(2, 22, 2, NEED_COLOR[shown], NEED_NAME[shown]);\n   \
    \   drawText(2, 44, 1, ST7735_TFT::COLOR_WHITE, \"Thanks! I know the\");\n   \
    \   drawText(2, 54, 1, ST7735_TFT::COLOR_WHITE, \"baby a little better.\");\n\
    \      drawText(2, 70, 1, UI_GREY, savedToFlash ? \"Saved to the baby's cries\"\
    \ : \"Kept until power-off\");\n      break;\n    case UI_NOT_SAVED:\n      drawText(2,\
    \ 12, 1, UI_GREY, \"NOT SAVED\");\n      drawText(2, 22, 2, ST7735_TFT::COLOR_WHITE,\
    \ \"None of these\");\n      drawText(2, 44, 1, UI_GREY, \"This cry won't teach\"\
    );\n      drawText(2, 54, 1, UI_GREY, \"me anything wrong.\");\n      break;\n\
    \    case UI_FORGOT:\n      drawText(2, 20, 2, ST7735_TFT::COLOR_WHITE, \"Start\
    \ over\");\n      drawText(2, 44, 1, UI_GREY, \"All saved cries\");\n      drawText(2,\
    \ 54, 1, UI_GREY, \"are forgotten.\");\n      break;\n  }\n  screen.display();\n\
    }\n"
  setup: 'screen.setRotation(1);

    screen.clear();

    greenLight.clear();

    greenLight.show();

    redLight.clear();

    redLight.show();


    store.begin();

    cry.begin();

    mic.onAudio(cryOnMic, nullptr);


    eventStart("cry_store");

    Serial.printf("{\"flash\":%s,\"learned\":%d}", store.ok ? "true" : "false", store.count);

    eventEnd();

    setUi(UI_LISTENING);

    '
  loop: "static unsigned long lastDraw = 0;\nstatic unsigned long lastDebug = 0;\n\
    static unsigned long bothSince = 0;\nstatic bool bothReleased = true;\nstatic\
    \ int lastHint = 0;\n\nif (cry.pump(ui == UI_LISTENING)) startGuess();\n\n// ----\
    \ actions from the laptop ----\nif (atech_action == \"cry_selftest\") {\n  static\
    \ float fp[CRY_N_FEATURES];\n  int r = crySelfTest(fp);   // blocks for a moment;\
    \ a debugging aid only\n  if (r < 0) {\n    atechFail(\"not enough memory\");\n\
    \  } else {\n    eventStart(\"cry_selftest_result\");\n    Serial.printf(\"{\\\
    \"result\\\":%d,\\\"fp\\\":\", r);\n    printFloats(fp, CRY_N_FEATURES);\n   \
    \ Serial.print('}');\n    eventEnd();\n  }\n  atechDone();\n  cry.skipBacklog();\n\
    } else if (atech_action == \"cries_reset\") {\n  store.clear();\n  lastHungryMs\
    \ = 0;\n  setUi(UI_FORGOT);\n  atechDone();\n}\n\n// ---- buttons: each edge is\
    \ read here only ----\nbool yes = correctButton.wasPressed();\nbool no = wrongButton.wasPressed();\n\
    unsigned long now = millis();\n\nswitch (ui) {\n  case UI_CRY_HEARD:\n    if (now\
    \ - uiSince >= CRY_HEARD_MS) setUi(UI_GUESS);\n    break;\n  case UI_GUESS:\n\
    \    if (yes) confirmGuess();\n    else if (no) rejectGuess();\n    else if (now\
    \ - uiSince >= ANSWER_TIMEOUT_MS) backToListening();\n    break;\n  case UI_GOT_IT:\n\
    \  case UI_NOT_SAVED:\n    if (now - uiSince >= MESSAGE_MS) backToListening();\n\
    \    break;\n  case UI_FORGOT:\n    if (now - uiSince >= MESSAGE_MS) setUi(UI_LISTENING);\n\
    \    break;\n  case UI_LISTENING:\n    break;\n}\n\n// Hold both buttons for 3\
    \ s while listening: forget every saved cry.\nbool both = correctButton.isPressed()\
    \ && wrongButton.isPressed();\nif (!correctButton.isPressed() || !wrongButton.isPressed())\
    \ bothReleased = true;\nif (ui == UI_LISTENING && both && bothReleased) {\n  if\
    \ (!bothSince) bothSince = now | 1;\n  if (now - bothSince >= FORGET_HOLD_MS)\
    \ {\n    store.clear();\n    lastHungryMs = 0;\n    bothSince = 0;\n    bothReleased\
    \ = false;\n    setUi(UI_FORGOT);\n    eventStart(\"cries_reset\");\n    Serial.print(\"\
    {\\\"learned\\\":0}\");\n    eventEnd();\n  }\n} else {\n  bothSince = 0;\n}\n\
    \nif (lightOn && now - lightSince >= LIGHT_MS) {\n  greenLight.clear();\n  greenLight.show();\n\
    \  redLight.clear();\n  redLight.show();\n  lightOn = false;\n}\n\nif (now - lastDebug\
    \ >= 250) {\n  lastDebug = now;\n  eventStart(\"cry_debug\");\n  Serial.printf(\"\
    {\\\"db\\\":%.1f,\\\"floor\\\":%.1f,\\\"f0\\\":%.0f,\\\"voicing\\\":%.2f,\\\"\
    flatness\\\":%.3f,\\\"cry\\\":%d,\"\n                \"\\\"window\\\":%.2f,\\\"\
    bursts\\\":%d,\\\"armed\\\":%d,\\\"overruns\\\":%lu}\",\n                cry.last.db,\
    \ cry.floorDb, cry.last.f0, cry.last.voicing, cry.last.flatness, cry.lastCry ?\
    \ 1 : 0,\n                cry.windowFraction(), cry.windowBursts(), cry.isArmed()\
    \ ? 1 : 0, (unsigned long)cry.overruns);\n  eventEnd();\n}\n\nif (ui == UI_LISTENING\
    \ && listeningHint() != lastHint) {\n  lastHint = listeningHint();\n  uiDirty\
    \ = true;\n}\nif (uiDirty && now - lastDraw >= 250) {\n  lastDraw = now;\n  uiDirty\
    \ = false;\n  drawUi();\n}\n"
