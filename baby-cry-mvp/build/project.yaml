  instance: greenLight
  port: port_1
- id: button
  instance: correctButton
  port: port_2
- id: st7735_tft
  instance: screen
  ports:
  - port_3
  - port_4
- id: button
  instance: wrongButton
  port: port_5
- id: neopixel
  instance: redLight
  port: port_6
