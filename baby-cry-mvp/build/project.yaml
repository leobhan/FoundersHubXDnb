  instance: greenLight
  port: port_1
- id: button
  instance: correctButton
  port: port_2
- id: st7735_tft
  instance: screen
  ports:
  - port_3
  - port_4
- id: button
  instance: wrongButton
  port: port_5
- id: neopixel
  instance: redLight
  port: port_6
- id: microphone
  instance: mic
  ports:
  - port_13
  - port_14
feedback: false
code:
  globals: "// Hearing a cry and guessing the need happen in cry/ (cry_dsp.h, cry_engine.h);\n\
    // tools/baseline/README.md explains where the baseline comes from.\n#include\
    \ <LittleFS.h>   // here too, so PlatformIO finds the library\n#include \"../../cry/cry_engine.h\"\
    \n\nstatic const char* const NEED_NAME[CRY_N_NEEDS] = {\"Hungry\", \"Sleepy\"\
    , \"Diaper\", \"Discomfort\"};\nstatic const char* const NEED_SHORT[CRY_N_NEEDS]\
    \ = {\"Hun\", \"Sle\", \"Dia\", \"Dis\"};\nstatic const char* const NEED_HINT[CRY_N_NEEDS]\
    \ = {\"Try a feed\", \"Try settling to sleep\", \"Check the diaper\",\n      \
    \                                             \"Burp, check temperature\"};\n\
    // The design's colours #F5A84A, #8DB8F2, #B9A3F2, #F08FA8 in RGB565.\nstatic\
    \ const uint16_t NEED_COLOR[CRY_N_NEEDS] = {0xF549, 0x8DDE, 0xBD1E, 0xF475};\n\
    static const uint16_t UI_GREY = 0x9CD3;\n\nenum UiState { UI_LISTENING, UI_CRY_HEARD,\
    \ UI_GUESS, UI_GOT_IT, UI_NOT_SAVED, UI_FORGOT };\nstatic const unsigned long\
    \ CRY_HEARD_MS = 1500;\nstatic const unsigned long MESSAGE_MS = 3000;\nstatic\
    \ const unsigned long ANSWER_TIMEOUT_MS = 20UL * 1000;   // no answer: back to\
    \ listening\nstatic const unsigned long FORGET_HOLD_MS = 3000;\nstatic const unsigned\
    \ long LIGHT_MS = 1000;\nstatic const uint8_t LIGHT_DIM = 6, LIGHT_BRIGHT = 40;\n\
    static const int RECORD_MAX_S = 8;\nstatic const int RECORD_CHUNK = 240;   //\
    \ samples per mic_record event\n\nstatic CryListener cry;\nstatic CryStore store;\n\
    static UiState ui = UI_LISTENING;\nstatic unsigned long uiSince = 0;\nstatic bool\
    \ uiDirty = true;\nstatic float guessFp[CRY_N_FEATURES];\nstatic float guessProb[CRY_N_NEEDS];\n\
    static uint8_t rejected = 0;            // a bit per need the parent said no to\n\
    static int shown = 0;                   // the need on screen\nstatic bool savedToFlash\
    \ = false;\nstatic unsigned long lastHungryMs = 0;  // last confirmed Hungry,\
    \ 0 = none since boot\nstatic bool lightOn = false;\nstatic unsigned long lightSince\
    \ = 0;\n\nstatic void setUi(UiState s) {\n  ui = s;\n  uiSince = millis();\n \
    \ uiDirty = true;\n}\n\n// The next guess waits until the baby has been quiet,\
    \ so one long cry gives one guess.\nstatic void backToListening() {\n  cry.disarm();\n\
    \  setUi(UI_LISTENING);\n}\n\n// Each button has its light beside it, always on:\
    \ green by the yes button,\n// red by the no button. A press makes its light bright\
    \ for a moment.\nstatic void showLights(bool greenBright, bool redBright) {\n\
    \  greenLight.setBrightness(greenBright ? LIGHT_BRIGHT : LIGHT_DIM);\n  greenLight.setAll(0,\
    \ 255, 0);\n  greenLight.show();\n  redLight.setBrightness(redBright ? LIGHT_BRIGHT\
    \ : LIGHT_DIM);\n  redLight.setAll(255, 0, 0);\n  redLight.show();\n}\n\nstatic\
    \ void flashLight(bool green) {\n  showLights(green, !green);\n  lightOn = true;\n\
    \  lightSince = millis();\n}\n\n// ---- events to the laptop ----\n\nstatic void\
    \ eventStart(const char* key) {\n  Serial.print(\"{\\\"type\\\":\\\"event\\\"\
    ,\\\"payload\\\":{\\\"event_type\\\":\\\"sensor\\\",\\\"key\\\":\\\"\");\n  Serial.print(key);\n\
    \  Serial.print(\"\\\",\\\"value\\\":\");\n}\n\nstatic void eventEnd() { Serial.println(\"\
    }}\"); }\n\nstatic void printBase64(const uint8_t* d, int n) {\n  static const\
    \ char B64[] = \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/\"\
    ;\n  char out[5] = {0};\n  for (int i = 0; i < n; i += 3) {\n    uint32_t v =\
    \ d[i] << 16 | (i + 1 < n ? d[i + 1] << 8 : 0) | (i + 2 < n ? d[i + 2] : 0);\n\
    \    out[0] = B64[v >> 18 & 63];\n    out[1] = B64[v >> 12 & 63];\n    out[2]\
    \ = i + 1 < n ? B64[v >> 6 & 63] : '=';\n    out[3] = i + 2 < n ? B64[v & 63]\
    \ : '=';\n    Serial.print(out);\n  }\n}\n\nstatic void printFloats(const float*\
    \ v, int n) {\n  Serial.print('[');\n  for (int i = 0; i < n; i++) {\n    if (i)\
    \ Serial.print(',');\n    Serial.print(v[i], 5);\n  }\n  Serial.print(']');\n\
    }\n\n// ---- the guess and the buttons ----\n\n// The most likely need the parent\
    \ has not said no to, or -1.\nstatic int bestRemaining() {\n  int best = -1;\n\
    \  for (int c = 0; c < CRY_N_NEEDS; c++)\n    if (!(rejected & (1 << c)) && (best\
    \ < 0 || guessProb[c] > guessProb[best])) best = c;\n  return best;\n}\n\n// A\
    \ need's share of what is left after the parent's no's, in %.\nstatic int percentOf(int\
    \ c) {\n  float left = 0;\n  for (int k = 0; k < CRY_N_NEEDS; k++)\n    if (!(rejected\
    \ & (1 << k))) left += guessProb[k];\n  return (int)lroundf(100 * guessProb[c]\
    \ / left);\n}\n\nstatic void startGuess() {\n  memcpy(guessFp, cry.fp, sizeof(guessFp));\n\
    \  float boost = 1;   // Hungry gets likelier from 2 h after a confirmed feed,\
    \ up to 2x at 4 h\n  if (lastHungryMs) {\n    float hours = (millis() - lastHungryMs)\
    \ / 3600000.0f;\n    boost = 1 + fminf(1, fmaxf(0, (hours - 2) / 2));\n  }\n \
    \ cryPosterior(guessFp, store.cries, store.count, boost, guessProb);\n  rejected\
    \ = 0;\n  shown = bestRemaining();\n  setUi(UI_CRY_HEARD);\n  eventStart(\"cry_guess\"\
    );\n  Serial.print('{');\n  for (int c = 0; c < CRY_N_NEEDS; c++) Serial.printf(\"\
    \\\"%s\\\":%.3f,\", NEED_NAME[c], guessProb[c]);\n  Serial.printf(\"\\\"learned\\\
    \":%d,\\\"hungry_boost\\\":%.2f}\", store.count, boost);\n  eventEnd();\n}\n\n\
    // Green: the shown need was right. The cry is saved for this baby.\nstatic void\
    \ confirmGuess() {\n  savedToFlash = store.add(shown, guessFp);\n  if (shown ==\
    \ NEED_HUNGRY) lastHungryMs = millis() | 1;\n  eventStart(\"cry_saved\");\n  Serial.printf(\"\
    {\\\"need\\\":\\\"%s\\\",\\\"learned\\\":%d,\\\"in_flash\\\":%s,\\\"fp\\\":\"\
    , NEED_NAME[shown], store.count,\n                savedToFlash ? \"true\" : \"\
    false\");\n  printFloats(guessFp, CRY_N_FEATURES);\n  Serial.print('}');\n  eventEnd();\n\
    \  flashLight(true);\n  setUi(UI_GOT_IT);\n}\n\n// Red: show the next most likely\
    \ need. After all four, nothing is saved.\nstatic void rejectGuess() {\n  rejected\
    \ |= 1 << shown;\n  flashLight(false);\n  shown = bestRemaining();\n  if (shown\
    \ < 0) setUi(UI_NOT_SAVED);\n  else uiDirty = true;\n}\n\n// ---- screen (plain\
    \ placeholder until the Nattlys design is built) ----\n\nstatic void drawText(int\
    \ x, int y, uint8_t size, uint16_t color, const char* text) {\n  screen.setTextSize(size);\n\
    \  screen.setTextColor(color);\n  screen.setCursor(x, y);\n  screen.print(text);\n\
    }\n\n// What the listening screen shows, as a number that changes when it should\
    \ redraw:\n// 0 listening, 1 waiting for quiet, 2..12 hearing a cry (its progress\
    \ in tenths).\nstatic int listeningHint() {\n  if (cry.hearing()) return 2 + min(10,\
    \ cry.heardFrames() * 10 / CRY_EPISODE_CRY_FRAMES);\n  if (!cry.isArmed()) return\
    \ 1;\n  return 0;\n}\n\nstatic void drawUi() {\n  char buf[32];\n  screen.clear();\n\
    \  drawText(2, 1, 1, ST7735_TFT::COLOR_WHITE, \"Nattlys\");\n  snprintf(buf, sizeof(buf),\
    \ \"%d learned\", store.count);\n  drawText(screen.width() - 2 - 6 * (int)strlen(buf),\
    \ 1, 1, UI_GREY, buf);\n\n  switch (ui) {\n    case UI_LISTENING: {\n      int\
    \ hint = listeningHint();\n      if (hint >= 2) {\n        // Stays up through\
    \ the pauses in a cry; the bar fills as crying is heard.\n        drawText(2,\
    \ 20, 2, ST7735_TFT::COLOR_ORANGE, \"Hearing a cry\");\n        drawText(2, 44,\
    \ 1, UI_GREY, \"Pauses are fine. The\");\n        drawText(2, 54, 1, UI_GREY,\
    \ \"guess comes when ready.\");\n        int w = screen.width() - 4;\n       \
    \ screen.drawRect(2, 68, w, 8, UI_GREY);\n        screen.fillRect(2, 68, w * (hint\
    \ - 2) / 10, 8, ST7735_TFT::COLOR_ORANGE);\n        break;\n      }\n      drawText(2,\
    \ 20, 2, ST7735_TFT::COLOR_WHITE, \"Listening\");\n      drawText(2, 44, 1, UI_GREY,\
    \ \"A guess appears when\");\n      drawText(2, 54, 1, UI_GREY, \"the baby cries.\"\
    );\n      if (hint == 1) drawText(2, 70, 1, UI_GREY, \"Next guess after quiet\"\
    );\n      break;\n    }\n    case UI_CRY_HEARD:\n      drawText(2, 20, 2, ST7735_TFT::COLOR_WHITE,\
    \ \"Crying heard\");\n      snprintf(buf, sizeof(buf), \"Comparing with %d\",\
    \ store.count);\n      drawText(2, 44, 1, UI_GREY, buf);\n      drawText(2, 54,\
    \ 1, UI_GREY, store.count == 1 ? \"saved cry\" : \"saved cries\");\n      break;\n\
    \    case UI_GUESS: {\n      drawText(2, 12, 1, UI_GREY, rejected ? \"THEN MAYBE...\"\
    \ : \"BEST GUESS\");\n      drawText(2, 22, 2, NEED_COLOR[shown], NEED_NAME[shown]);\n\
    \      snprintf(buf, sizeof(buf), \"%d%% sure\", percentOf(shown));\n      drawText(2,\
    \ 40, 1, NEED_COLOR[shown], buf);\n      drawText(2, 50, 1, ST7735_TFT::COLOR_WHITE,\
    \ NEED_HINT[shown]);\n      int x = 2;\n      for (int c = 0; c < CRY_N_NEEDS;\
    \ c++) {\n        if (c == shown) continue;\n        if (rejected & (1 << c))\
    \ snprintf(buf, sizeof(buf), \"%s x \", NEED_SHORT[c]);\n        else snprintf(buf,\
    \ sizeof(buf), \"%s %d%% \", NEED_SHORT[c], percentOf(c));\n        drawText(x,\
    \ 60, 1, (rejected & (1 << c)) ? UI_GREY : NEED_COLOR[c], buf);\n        x +=\
    \ 6 * strlen(buf);\n      }\n      drawText(2, 71, 1, UI_GREY, \"Right? green\
    \ yes, red no\");\n      break;\n    }\n    case UI_GOT_IT:\n      drawText(2,\
    \ 12, 1, UI_GREY, \"GOT IT\");\n      drawText(2, 22, 2, NEED_COLOR[shown], NEED_NAME[shown]);\n\
    \      drawText(2, 44, 1, ST7735_TFT::COLOR_WHITE, \"Thanks! I know the\");\n\
    \      drawText(2, 54, 1, ST7735_TFT::COLOR_WHITE, \"baby a little better.\");\n\
    \      drawText(2, 70, 1, UI_GREY, savedToFlash ? \"Saved to the baby's cries\"\
    \ : \"Kept until power-off\");\n      break;\n    case UI_NOT_SAVED:\n      drawText(2,\
    \ 12, 1, UI_GREY, \"NOT SAVED\");\n      drawText(2, 22, 2, ST7735_TFT::COLOR_WHITE,\
    \ \"None of these\");\n      drawText(2, 44, 1, UI_GREY, \"This cry won't teach\"\
    );\n      drawText(2, 54, 1, UI_GREY, \"me anything wrong.\");\n      break;\n\
    \    case UI_FORGOT:\n      drawText(2, 20, 2, ST7735_TFT::COLOR_WHITE, \"Start\
    \ over\");\n      drawText(2, 44, 1, UI_GREY, \"All saved cries\");\n      drawText(2,\
    \ 54, 1, UI_GREY, \"are forgotten.\");\n      break;\n  }\n  screen.display();\n\
    }\n"
  setup: 'screen.setRotation(1);

    screen.clear();

    showLights(false, false);


    store.begin();

    cry.begin();

    mic.onAudio(cryOnMic, nullptr);


    eventStart("cry_store");

    Serial.printf("{\"flash\":%s,\"learned\":%d}", store.ok ? "true" : "false", store.count);

    eventEnd();

    setUi(UI_LISTENING);

    '
  loop: "static unsigned long lastDraw = 0;\nstatic unsigned long lastDebug = 0;\n\
    static unsigned long bothSince = 0;\nstatic bool bothReleased = true;\nstatic\
    \ int lastHint = 0;\nstatic bool recReady = false;\n\nif (cry.pump(ui == UI_LISTENING))\
    \ startGuess();\n\n// ---- actions from the laptop ----\nif (atech_action == \"\
    cry_selftest\") {\n  static float fp[CRY_N_FEATURES];\n  int r = crySelfTest(fp);\
    \   // blocks for a moment; a debugging aid only\n  if (r < 0) {\n    atechFail(\"\
    not enough memory\");\n  } else {\n    eventStart(\"cry_selftest_result\");\n\
    \    Serial.printf(\"{\\\"result\\\":%d,\\\"fp\\\":\", r);\n    printFloats(fp,\
    \ CRY_N_FEATURES);\n    Serial.print('}');\n    eventEnd();\n  }\n  atechDone();\n\
    \  cry.skipBacklog();\n} else if (atech_action == \"mic_record\") {\n  // Records\
    \ what the detector hears for N seconds (default 6), then sends\n  // mic_record_end.\
    \ The laptop then fetches it with mic_record_get <at>, one\n  // chunk per call\
    \ so a chunk USB garbled can be asked for again, and frees\n  // it with mic_record_free.\n\
    \  int secs = atech_value.length() ? atech_value.toInt() : 6;\n  if (secs < 1\
    \ || secs > RECORD_MAX_S) {\n    atechFail(\"seconds must be 1 to 8\");\n  } else\
    \ if (!cry.startRecording(secs * CRY_FS)) {\n    atechFail(\"not enough memory\"\
    );\n  } else {\n    recReady = false;\n    atechDone();\n  }\n} else if (atech_action\
    \ == \"mic_record_get\") {\n  int at = atech_value.toInt();\n  if (!recReady ||\
    \ at < 0 || at >= cry.recLen) {\n    atechFail(\"no recording there\");\n  } else\
    \ {\n    int n = min(RECORD_CHUNK, cry.recLen - at);\n    eventStart(\"mic_record\"\
    );\n    Serial.printf(\"{\\\"at\\\":%d,\\\"n\\\":%d,\\\"pcm\\\":\\\"\", at, n);\n\
    \    printBase64((const uint8_t*)(cry.rec + at), n * 2);\n    Serial.print(\"\\\
    \"}\");\n    eventEnd();\n    atechDone();\n  }\n} else if (atech_action == \"\
    mic_record_free\") {\n  cry.stopRecording();\n  recReady = false;\n  atechDone();\n\
    } else if (atech_action == \"cries_reset\") {\n  store.clear();\n  lastHungryMs\
    \ = 0;\n  setUi(UI_FORGOT);\n  atechDone();\n}\n\n// ---- buttons: each edge is\
    \ read here only ----\nbool yes = correctButton.wasPressed();\nbool no = wrongButton.wasPressed();\n\
    unsigned long now = millis();\n\nswitch (ui) {\n  case UI_CRY_HEARD:\n    if (now\
    \ - uiSince >= CRY_HEARD_MS) setUi(UI_GUESS);\n    break;\n  case UI_GUESS:\n\
    \    if (yes) confirmGuess();\n    else if (no) rejectGuess();\n    else if (now\
    \ - uiSince >= ANSWER_TIMEOUT_MS) backToListening();\n    break;\n  case UI_GOT_IT:\n\
    \  case UI_NOT_SAVED:\n    if (now - uiSince >= MESSAGE_MS) backToListening();\n\
    \    break;\n  case UI_FORGOT:\n    if (now - uiSince >= MESSAGE_MS) setUi(UI_LISTENING);\n\
    \    break;\n  case UI_LISTENING:\n    break;\n}\n\n// Hold both buttons for 3\
    \ s while listening: forget every saved cry.\nbool both = correctButton.isPressed()\
    \ && wrongButton.isPressed();\nif (!correctButton.isPressed() || !wrongButton.isPressed())\
    \ bothReleased = true;\nif (ui == UI_LISTENING && both && bothReleased) {\n  if\
    \ (!bothSince) bothSince = now | 1;\n  if (now - bothSince >= FORGET_HOLD_MS)\
    \ {\n    store.clear();\n    lastHungryMs = 0;\n    bothSince = 0;\n    bothReleased\
    \ = false;\n    setUi(UI_FORGOT);\n    eventStart(\"cries_reset\");\n    Serial.print(\"\
    {\\\"learned\\\":0}\");\n    eventEnd();\n  }\n} else {\n  bothSince = 0;\n}\n\
    \nif (lightOn && now - lightSince >= LIGHT_MS) {\n  showLights(false, false);\n\
    \  lightOn = false;\n}\n\nif (cry.rec && cry.recPos == cry.recLen && !recReady)\
    \ {\n  recReady = true;\n  eventStart(\"mic_record_end\");\n  Serial.printf(\"\
    {\\\"samples\\\":%d,\\\"rate\\\":%d}\", cry.recLen, CRY_FS);\n  eventEnd();\n\
    }\n\nif (now - lastDebug >= 250) {\n  lastDebug = now;\n  eventStart(\"cry_debug\"\
    );\n  Serial.printf(\"{\\\"db\\\":%.1f,\\\"floor\\\":%.1f,\\\"f0\\\":%.0f,\\\"\
    voicing\\\":%.2f,\\\"flatness\\\":%.3f,\\\"cry\\\":%d,\"\n                \"\\\
    \"heard\\\":%d,\\\"quiet_s\\\":%.1f,\\\"armed\\\":%d,\\\"overruns\\\":%lu}\",\n\
    \                cry.last.db, cry.floorDb, cry.last.f0, cry.last.voicing, cry.last.flatness,\
    \ cry.lastCry ? 1 : 0,\n                cry.hearing() ? cry.heardFrames() : -1,\
    \ cry.quietFrames * CRY_FRAME / (float)CRY_FS,\n                cry.isArmed()\
    \ ? 1 : 0, (unsigned long)cry.overruns);\n  eventEnd();\n}\n\nif (ui == UI_LISTENING\
    \ && listeningHint() != lastHint) {\n  lastHint = listeningHint();\n  uiDirty\
    \ = true;\n}\nif (uiDirty && now - lastDraw >= 250) {\n  lastDraw = now;\n  uiDirty\
    \ = false;\n  drawUi();\n}\n"
